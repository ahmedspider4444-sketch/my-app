    <style>
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-light: #64748b;
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
            direction: rtl;
        }
        #lockScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .lock-container {
            background: white; border-radius: var(--radius); padding: 30px;
            text-align: center; max-width: 320px; width: 90%;
        }
        .lock-container input { width: 100%; padding: 12px; margin: 16px 0; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; text-align: center; }
        .lock-container button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #mainApp { display: none; }
        .container { max-width: 600px; margin: 0 auto; background: var(--card); border-radius: var(--radius); box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .app-header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; padding: 20px 24px; text-align: center; }
        .app-header h1 { font-size: 1.4rem; margin-bottom: 4px; }
        .app-header p { font-size: 0.8rem; opacity: 0.8; }
        .tabs { display: flex; background: #f1f5f9; border-bottom: 2px solid var(--border); overflow-x: auto; }
        .tab-btn { flex: 1; padding: 14px 8px; background: transparent; border: none; font-size: 0.75rem; font-weight: 600; color: var(--text-light); cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .tab-btn.active { color: var(--accent); background: white; }
        .tab-btn.active::after { content: ''; display: block; height: 2px; background: var(--accent); }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }
        label { font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; display: block; }
        textarea, input[type="text"], input[type="file"] { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px; font-size: 0.95rem; background: #fafbfc; font-family: inherit; }
        textarea { height: 100px; resize: vertical; }
        .btn-group { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        button { padding: 12px 20px; border: none; border-radius: 10px; font-weight: 600; font-size: 0.9rem; cursor: pointer; color: white; flex: 1; min-width: 80px; transition: 0.2s; }
        button:active { transform: scale(0.97); }
        .btn-enc { background: var(--accent); }
        .btn-dec { background: var(--success); }
        .btn-warning { background: var(--warning); color: #1e293b; }
        .btn-copy { background: #64748b; }
        .btn-gen { background: #8b5cf6; font-size: 0.8rem; padding: 6px 12px; min-width: auto; flex: 0; }
        .result-box { background: #f1f5f9; border: 2px dashed var(--border); padding: 14px; border-radius: 10px; min-height: 50px; word-break: break-all; margin-top: 12px; font-family: monospace; direction: ltr; text-align: center; }
        .timer-box { background: #fef3c7; color: #92400e; padding: 10px; border-radius: 8px; margin-top: 10px; text-align: center; font-weight: bold; }
        .file-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 25px; text-align: center; cursor: pointer; background: #fafbfc; }
    </style>
</head>
<body>

<div id="lockScreen">
    <div class="lock-container">
        <h2>🔐 تفعيل الترخيص</h2>
        <p style="font-size:0.9rem; color:#64748b;">أدخل كود الترخيص الذي حصلت عليه</p>
        <input type="text" id="licenseKey" placeholder="كود الترخيص">
        <button onclick="activateLicense()">تفعيل</button>
        <p style="font-size:0.8rem; color:var(--danger); margin-top:8px;" id="activationError"></p>
    </div>
</div>

<div id="mainApp">
    <div class="container">
        <div class="app-header">
            <h1>🔐 منصة الخصوصية الشاملة</h1>
            <p>جميع الميزات جاهزة</p>
            <p id="expiryBanner" style="background:#fef3c7; color:#92400e; padding:5px; border-radius:5px; margin-top:5px; font-size:0.8rem;"></p>
        </div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('text')">📝 النصوص</button>
            <button class="tab-btn" onclick="switchTab('file')">📁 الملفات</button>
            <button class="tab-btn" onclick="switchTab('handshake')">🤝 المصافحة</button>
            <button class="tab-btn" onclick="switchTab('settings')">⚙️ الإعدادات</button>
        </div>
        <!-- تبويب النصوص -->
        <div id="tab-text" class="tab-content active">
            <label>🔑 المفتاح <button class="btn-gen" onclick="generatePassword('keyInput')">🎲 توليد</button></label>
            <input type="text" id="keyInput" placeholder="أدخل كلمة السر...">
            <label style="margin-top:12px;">📝 النص</label>
            <textarea id="textInput" placeholder="اكتب النص هنا..."></textarea>
            <div class="btn-group">
                <button class="btn-enc" onclick="processText(true)">🔒 تشفير</button>
                <button class="btn-dec" onclick="processText(false)">🔓 فك</button>
                <button class="btn-warning" onclick="selfDestruct()">💣 تدمير ذاتي</button>
            </div>
            <div class="result-box" id="resultOutput">النتيجة تظهر هنا...</div>
            <div id="timerDisplay" class="timer-box" style="display:none;"></div>
            <button class="btn-copy" onclick="copyResult()" style="margin-top:8px; width:100%;">📋 نسخ</button>
        </div>
        <!-- تبويب الملفات -->
        <div id="tab-file" class="tab-content">
            <label>🔑 مفتاح الملف <button class="btn-gen" onclick="generatePassword('fileKey')">🎲 توليد</button></label>
            <input type="text" id="fileKey" placeholder="أدخل كلمة السر...">
            <div class="file-zone" onclick="document.getElementById('fileInput').click()"><p>📤 اضغط لاختيار ملف</p><p style="font-size:0.7rem; color:var(--text-light);">يدعم الملفات الضخمة</p></div>
            <input type="file" id="fileInput" style="display:none;" onchange="handleFileSelect(event)">
            <p id="fileStatus" style="font-size:0.8rem; margin-top:6px;"></p>
            <div class="btn-group">
                <button class="btn-enc" onclick="encryptFile()">🔒 تشفير</button>
                <button class="btn-dec" onclick="decryptFile()">🔓 فك</button>
            </div>
            <div class="result-box" id="fileResult">الملف الناتج...</div>
        </div>
        <!-- تبويب المصافحة -->
        <div id="tab-handshake" class="tab-content">
            <p style="margin-bottom:12px; color:var(--text-light);">أنشئ مفتاحاً مشتركاً دون إرساله.</p>
            <label>🔢 Base</label><input type="text" id="baseCode" placeholder="يظهر تلقائياً">
            <label>🔒 Public A</label><input type="text" id="publicA" placeholder="يظهر تلقائياً">
            <label>🔓 Public B</label><input type="text" id="publicB" placeholder="ألصقه هنا">
            <div class="btn-group">
                <button class="btn-warning" onclick="startHandshake()">⚡ بدء</button>
                <button class="btn-warning" onclick="joinHandshake()">📥 انضمام</button>
                <button class="btn-warning" onclick="confirmKey()">🔑 تأكيد</button>
            </div>
            <p id="handshakeStatus" style="font-size:0.8rem; margin-top:8px; color:var(--text-light);"></p>
        </div>
        <!-- تبويب الإعدادات -->
        <div id="tab-settings" class="tab-content">
            <label>🔐 تغيير كلمة سر القفل الرئيسي</label>
            <input type="password" id="newPassword" placeholder="كلمة سر جديدة">
            <input type="password" id="confirmPassword" placeholder="تأكيد كلمة السر الجديدة" style="margin-top:8px;">
            <div style="display:flex; gap:10px; margin-top:12px;">
                <button class="btn-enc" onclick="changeMasterPassword()" style="flex:1;">💾 حفظ</button>
                <button class="btn-copy" onclick="clearPasswordFields()" style="flex:0.5; background:#94a3b8;">🗑️ مسح</button>
            </div>
            <p id="settingsMsg" style="font-size:0.8rem; margin-top:12px; color:var(--text-light);"></p>
        </div>
    </div>
</div>

<script>
    // ====================== الإعدادات ======================
    const alphabet = " أبتثجحخدذرزسشصضطظعغفقكلمنهويةءئؤإأآلالإلأآًٌٍَُِّْ0123456789";
    const N = alphabet.length;
    const MASTER_KEY = "Khaled2024Secure!";
    let masterPassword = "1234";
    const MAX_FILE_SIZE = 500 * 1024 * 1024;
    const CSV_URL = "https://docs.google.com/spreadsheets/d/1pPto_rCEvvtL35caKvRstm0Ql2tHAX5ctJvjHOmtWdw/export?format=csv";

    let selfDestructTimer = null;
    let selectedFileData = null, selectedFileName = "";
    let secretA = null, secretB = null, baseV = null;

    // ====================== الترخيص ======================
    function isLicenseStored() {
        const lic = localStorage.getItem('validLicense');
        if (!lic) return false;
        try {
            const parts = lic.split("|");
            if (parts.length < 3) return false;
            const activationDate = new Date(parts[1]);
            const durationDays = parseInt(parts[2]);
            const now = new Date();
            const expiryDate = new Date(activationDate);
            expiryDate.setDate(expiryDate.getDate() + durationDays);
            return now <= expiryDate;
        } catch (e) { return false; }
    }

    function getRemainingDays() {
        const lic = localStorage.getItem('validLicense');
        if (!lic) return 0;
        const parts = lic.split("|");
        const activationDate = new Date(parts[1]);
        const durationDays = parseInt(parts[2]);
        const now = new Date();
        const expiryDate = new Date(activationDate);
        expiryDate.setDate(expiryDate.getDate() + durationDays);
        const diffTime = expiryDate - now;
        return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    }

    async function checkLicenseOnline(code) {
        try {
            const response = await fetch(CSV_URL);
            const csv = await response.text();
            const rows = csv.trim().split("\n");
            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i].split(",");
                if (cols.length < 4) continue;
                const c = cols[0].trim();
                const exp = cols[1].trim();
                const act = cols[2].trim().toUpperCase();
                const dur = cols[3].trim();
                if (c === code && act === "TRUE") {
                    if (exp && exp !== "") return { valid: new Date(exp) >= new Date(), duration: 0, expiry: exp };
                    else if (dur && dur !== "") return { valid: true, duration: parseInt(dur), expiry: null };
                }
            }
            return { valid: false };
        } catch (err) { return null; }
    }

    async function activateLicense() {
        const code = document.getElementById('licenseKey').value.trim();
        if (!code) return alert("أدخل كود الترخيص!");
        const result = await checkLicenseOnline(code);
        if (result === null) {
            document.getElementById('activationError').innerText = "⚠️ لا يوجد اتصال. تعذر التحقق.";
            return;
        }
        if (result.valid) {
            const activationDate = new Date().toISOString();
            const durationDays = result.duration || 30;
            localStorage.setItem('validLicense', code + "|" + activationDate + "|" + durationDays);
            alert("✅ تم تفعيل الترخيص لمدة " + durationDays + " يوم!");
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            updateExpiryBanner();
        } else {
            document.getElementById('activationError').innerText = "❌ كود غير صالح أو منتهي الصلاحية.";
        }
    }

    function updateExpiryBanner() {
        const banner = document.getElementById('expiryBanner');
        if (!isLicenseStored()) {
            banner.innerText = "انتهت صلاحية ترخيصك. يرجى التواصل مع الدعم للحصول على كود جديد.";
            banner.style.background = "#fee2e2";
            banner.style.color = "#991b1b";
            return;
        }
        const days = getRemainingDays();
        if (days <= 0) {
            banner.innerText = "انتهت صلاحية ترخيصك. يرجى التواصل مع الدعم للحصول على كود جديد.";
            banner.style.background = "#fee2e2";
            banner.style.color = "#991b1b";
        } else {
            banner.innerText = `متبقي على انتهاء الترخيص: ${days} يوم`;
            banner.style.background = "#fef3c7";
            banner.style.color = "#92400e";
        }
    }

    // ====================== فتح التطبيق ======================
    window.onload = function() {
        if (isLicenseStored()) {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            updateExpiryBanner();
        } else {
            document.getElementById('lockScreen').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
        }
    };

    // ... (باقي الدوال: processText, encryptFile, decryptFile, startHandshake, changeMasterPassword, إلخ)
    // هي نفسها بالضبط الموجودة في الإصدارات السابقة. لم تتغير.
</script>
</body>
