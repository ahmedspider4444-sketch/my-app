    <style>
        /* نفس التنسيق السابق دون تغيير */
        :root { --primary: #0f172a; --accent: #3b82f6; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --bg: #f8fafc; --border: #e2e8f0; --radius: 16px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: #1e293b; min-height: 100vh; padding: 16px; direction: rtl; }
        #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.95); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .lock-container { background: white; border-radius: var(--radius); padding: 30px; text-align: center; max-width: 320px; width: 90%; }
        .lock-container input { width: 100%; padding: 12px; margin: 16px 0; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; text-align: center; }
        .lock-container button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #mainApp { display: none; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: var(--radius); box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .app-header { background: linear-gradient(135deg, var(--primary), #1e293b); color: white; padding: 20px 24px; text-align: center; }
        .tabs { display: flex; background: #f1f5f9; border-bottom: 2px solid var(--border); overflow-x: auto; }
        .tab-btn { flex: 1; padding: 14px 8px; background: transparent; border: none; font-size: 0.7rem; font-weight: 600; color: #64748b; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { color: var(--accent); background: white; border-bottom: 2px solid var(--accent); margin-bottom: -2px; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }
        label { font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; display: block; }
        textarea, input[type="text"], input[type="file"] { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px; font-size: 0.95rem; background: #fafbfc; }
        textarea { height: 100px; resize: vertical; }
        .btn-group { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        button { padding: 12px 20px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; color: white; flex: 1; min-width: 80px; }
        .btn-enc { background: var(--accent); } .btn-dec { background: var(--success); } .btn-warning { background: var(--warning); color: #1e293b; } .btn-copy { background: #64748b; }
        .result-box { background: #f1f5f9; border: 2px dashed var(--border); padding: 14px; border-radius: 10px; margin-top: 12px; font-family: monospace; direction: ltr; text-align: center; }
        .file-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 25px; text-align: center; cursor: pointer; background: #fafbfc; }

<body>

<div id="lockScreen">
    <div class="lock-container">
        <h2>🔐 تفعيل الترخيص</h2>
        <p style="font-size:0.9rem; color:#64748b;">أدخل كود التفعيل لمرة واحدة</p>
        <input type="text" id="activationCode" placeholder="كود التفعيل">
        <button onclick="activateLicense()">تفعيل</button>
        <p style="font-size:0.8rem; color:var(--danger); margin-top:8px;" id="activationError"></p>
    </div>
</div>

<div id="mainApp">
    <!-- نفس الواجهة السابقة: النصوص، الملفات، المصافحة، الإعدادات -->
    <!-- تم حذف التكرار للاختصار، لكنها موجودة في الكود الكامل السابق -->
</div>

<script>
    // الإعدادات
    const alphabet = " أبتثجحخدذرزسشصضطظعغفقكلمنهويةءئؤإأآلالإلأآًٌٍَُِّْ0123456789";
    const N = alphabet.length;
    const MASTER_KEY = "MySecretKey2024!@#$";
    let masterPassword = "1234";
    const MAX_FILE_SIZE = 500 * 1024 * 1024;

    // بصمة جهاز بسيطة (تتغير بتغير المتصفح أو الجهاز)
    function getDeviceFingerprint() {
        const data = navigator.userAgent + navigator.language + screen.width + 'x' + screen.height + new Date().getTimezoneOffset();
        let hash = 0;
        for (let i = 0; i < data.length; i++) {
            hash = ((hash << 5) - hash) + data.charCodeAt(i);
            hash |= 0;
        }
        return Math.abs(hash).toString(16);
    }

    // تخزين واسترجاع الترخيص
    function getLicenseData() {
        const data = localStorage.getItem('licenseData');
        return data ? JSON.parse(data) : null;
    }

    function saveLicenseData(data) {
        localStorage.setItem('licenseData', JSON.stringify(data));
    }

    function isLicenseValid() {
        const lic = getLicenseData();
        if (!lic) return false;
        const now = new Date();
        const expiryDate = new Date(lic.expiryDate);
        return now <= expiryDate;
    }

    function getRemainingDays() {
        const lic = getLicenseData();
        if (!lic) return 0;
        const now = new Date();
        const expiryDate = new Date(lic.expiryDate);
        const diff = expiryDate - now;
        return Math.ceil(diff / (1000 * 60 * 60 * 24));
    }

    // التحقق من الكود عبر Sheets (قراءة فقط)
    async function checkLicenseOnline(code) {
        try {
            const response = await fetch(CSV_URL);
            const csv = await response.text();
            const rows = csv.trim().split('\n');
            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i].split(',');
                if (cols.length < 5) continue; // code, expiry, active, duration, deviceid
                const c = cols[0].trim();
                const exp = cols[1].trim();
                const act = cols[2].trim().toUpperCase();
                const dur = cols[3].trim();
                const devId = cols[4] ? cols[4].trim() : '';
                if (c === code && act === 'TRUE') {
                    // إذا كان هناك تاريخ انتهاء محدد
                    if (exp && exp !== '') {
                        return { valid: new Date(exp) >= new Date(), duration: 0, deviceId: devId };
                    }
                    // استخدام المدة
                    if (dur && dur !== '') {
                        return { valid: true, duration: parseInt(dur), deviceId: devId };
                    }
                }
            }
            return { valid: false };
        } catch (e) {
            return null; // لا يوجد اتصال
        }
    }

    // تفعيل الترخيص
    async function activateLicense() {
        const code = document.getElementById('activationCode').value.trim();
        if (!code) return;

        const currentFingerprint = getDeviceFingerprint();
        const result = await checkLicenseOnline(code);
        if (result === null) {
            document.getElementById('activationError').innerText = "⚠️ لا يوجد اتصال. تعذر التحقق.";
            return;
        }
        if (!result.valid) {
            document.getElementById('activationError').innerText = "❌ كود غير صالح أو منتهي الصلاحية.";
            return;
        }

        // إذا كان الكود مستخدمًا بالفعل على جهاز آخر
        if (result.deviceId && result.deviceId !== currentFingerprint) {
            document.getElementById('activationError').innerText = "❌ هذا الكود تم تفعيله على جهاز آخر.";
            return;
        }

        // السماح بالتفعيل
        const durationDays = result.duration || 30;
        const expiryDate = new Date();
        expiryDate.setDate(expiryDate.getDate() + durationDays);

        saveLicenseData({
            code: code,
            fingerprint: currentFingerprint,
            expiryDate: expiryDate.toISOString()
        });

        // (اختياري) يمكنك إرسال بصمة الجهاز إلى Google Sheets إذا أردت تتبعها
        // ولكن سنكتفي هنا بالتخزين المحلي

        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        updateUI();
        alert(`✅ تم تفعيل الترخيص لمدة ${durationDays} يوم.`);
    }

    // التحقق من الترخيص عند بدء التشغيل
    window.onload = function() {
        const lic = getLicenseData();
        if (lic && isLicenseValid() && lic.fingerprint === getDeviceFingerprint()) {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            updateUI();
        } else {
            // إذا انتهت الصلاحية أو تغير الجهاز، اطلب التفعيل
            document.getElementById('lockScreen').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
        }
    };

    // ... (باقي الدوال: processText, encryptFile, decryptFile, startHandshake, joinHandshake, confirmKey, changeMasterPassword, إلخ)
    // هي نفسها دون تغيير
</script>
