<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد أكواد التفعيل</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8fafc; direction: rtl; }
        .container { max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; }
        button { background: #3b82f6; color: white; border: none; cursor: pointer; font-weight: bold; }
        .result { background: #f1f5f9; padding: 15px; border-radius: 10px; text-align: center; font-family: monospace; font-size: 1.2rem; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎫 مولد أكواد التفعيل</h2>
        <label>اسم العميل (أو بريده)</label>
        <input type="text" id="username" placeholder="مثلاً: ahmed@example.com">
        <label>عدد الأيام</label>
        <input type="number" id="days" value="7" min="1">
        <label>المفتاح السري الرئيسي</label>
        <input type="password" id="masterKey" placeholder="المفتاح السري">
        <button onclick="generateCode()">توليد الكود</button>
        <div class="result" id="output">الكود سيظهر هنا...</div>
    </div>

    <script>
        function generateCode() {
            const user = document.getElementById('username').value.trim();
            const days = parseInt(document.getElementById('days').value);
            const masterKey = document.getElementById('masterKey').value.trim();
            if (!user || !masterKey || isNaN(days) || days <= 0) { alert("املأ جميع الحقول"); return; }

            const combined = user + "|" + days + "|" + masterKey;
            let hash = 0;
            for (let i = 0; i < combined.length; i++) {
                hash = ((hash << 5) - hash) + combined.charCodeAt(i);
                hash |= 0;
            }
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            const daysEncoded = days.toString(36).toUpperCase();
            let code = daysEncoded.padStart(4, '0');
            for (let i = 0; i < 16; i++) {
                code += chars[Math.abs((hash * (i + 1)) % chars.length)];
            }
            document.getElementById('output').innerText = code;
        }
    </script>
</body>
</html>
